<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的工作数字人 · 工作台</title><link rel="stylesheet" href="/static/style.css?v=rich-media"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="/" aria-label="工作数字人首页"><span class="brand-mark">w<span class="brand-dot">.</span></span><div>工作数字人</div></a>
  <div class="workspace"><span class="avatar owner">我</span><div><strong>我的工作空间</strong></div></div>
  <nav><button class="nav active" data-view="home" title="工作台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>工作台</button><button class="nav" data-view="conversations" title="会话与记忆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6A8.4 8.4 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>会话与记忆</button><button class="nav" data-view="personas" title="角色档案"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8M22 21v-2a7 7 0 0 0-4-6.3"/></svg>角色档案</button><button class="nav" data-view="activity" title="执行记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 14l4-4 4 2 5-7M17 5h4v4"/></svg>执行记录</button><button class="nav" data-view="settings" title="数字人设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h4l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3z"/><circle cx="12" cy="12" r="3"/></svg>数字人设置</button></nav>
  <button id="assistantLauncher" class="assistant-launcher" type="button" aria-controls="assistantPanel" aria-expanded="false" aria-label="打开数字人聊天"><span class="launcher-spark" aria-hidden="true">✦</span><span>数字人</span><i id="assistantUnread" hidden></i></button>
  <div class="sidebar-bottom"><div class="live-status"><i id="connectionDot"></i><span id="connectionText">正在连接</span></div><span class="local-label">● 仅本机访问</span></div>
</aside>
<main>
  <header class="topbar"><span id="breadcrumb">工作台</span><div><span id="date"></span><button class="icon-button" id="refresh" title="刷新" aria-label="刷新">↻</button></div></header>
  <div class="page-head"><div><h1 id="pageTitle">工作台</h1></div><button class="button secondary" id="toggleAutomation">暂停自动回复</button></div>
  <section class="stats" id="stats"></section>
  <div class="content-layout">
    <div id="mainView"></div>

  </div>
</main>
    <aside class="control-panel" id="assistantPanel" role="dialog" aria-labelledby="assistantTitle" hidden>
      <div class="panel-head"><span class="spark">✦</span><div><h2 id="assistantTitle">和数字人聊聊</h2></div><span class="tiny-badge">已就绪</span><button class="icon-button" id="assistantClose" type="button" aria-label="收起数字人聊天" title="收起">×</button></div>
      <div class="control-thread" id="controlThread"><div class="assistant-bubble"><div class="examples"><button data-command="总结一下我现在需要处理的事情">整理我的待办 ↗</button><button data-command="总结最近会话里需要我关注的事项，不要发消息">看看会话进展 ↗</button></div></div></div>
      <form id="controlForm" class="control-input"><textarea id="controlText" rows="3" placeholder="输入指令" required></textarea><div><small>发送指令会直接执行</small><button class="button primary" id="controlSubmit" type="submit">执行 ↑</button></div></form>
    </aside>

<dialog id="taskDialog"><div class="dialog-head"><div><h2 id="taskTitle"></h2></div><button class="icon-button" data-close>×</button></div><div id="taskDetail"></div><div class="row-flex"><label>任务状态<select id="taskStatus"><option value="open">待处理</option><option value="in_progress">进行中</option><option value="needs_attention">需要你决定</option><option value="done">已完成</option></select></label><label>优先级<select id="taskPriority"><option value="low">稍后处理</option><option value="normal">普通</option><option value="high">优先处理</option></select></label><button class="button secondary" id="taskSave">保存状态</button></div><form id="taskReplyForm"><label>回复对应会话<textarea id="taskReply" rows="4" placeholder="输入回复"></textarea></label><label>润色要求（可选）<input id="taskPolishInstruction" placeholder="例如：更简短、语气委婉一点、明确下一步"></label><div class="row-flex" style="margin-top:12px"><span class="subtle" id="taskPolishHint"></span><button type="button" class="button secondary" id="taskPolish">✳ AI 润色 / 起草</button></div><p class="subtle" id="taskSuffixPreview"></p><div class="dialog-actions"><button type="button" class="button secondary" id="taskDone">标记完成</button><button class="button primary" id="taskSendButton" type="submit">发送回复 ↗</button></div></form></dialog>
<dialog id="newTaskDialog"><div class="dialog-head"><h2>添加待办</h2><button class="icon-button" data-close>×</button></div><form id="newTaskForm"><label>任务标题<input id="newTaskTitle" required maxlength="256" placeholder="需要处理什么？"></label><label>详情<textarea id="newTaskDetails" rows="3"></textarea></label><label>关联会话<select id="newTaskChat"></select></label><div class="dialog-actions"><button class="button primary" type="submit">添加到工作台</button></div></form></dialog>
<div id="toast" role="status"></div>
<script src="/static/app.js?v=rich-media-3"></script>
</body></html>
